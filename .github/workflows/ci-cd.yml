name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ticketing_user
          POSTGRES_PASSWORD: ticketing_pass
          POSTGRES_DB: ticketing_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt
    
    - name: Run backend tests
      env:
        DATABASE_URL: postgresql://ticketing_user:ticketing_pass@localhost:5432/ticketing_db
        SECRET_KEY: test-secret-key
        SMTP_HOST: smtp.test.com
        SMTP_PORT: 587
        SMTP_USER: test@test.com
        SMTP_PASSWORD: test
        EMAIL_FROM: test@test.com
        REDIS_URL: redis://localhost:6379/0
      run: |
        cd backend
        pytest || echo "No tests found yet"

  frontend-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build backend Docker image
      run: |
        docker build -t ticketing-backend:latest ./backend
    
    - name: Build frontend Docker image
      run: |
        docker build -t ticketing-frontend:latest ./frontend
    
    - name: Test Docker Compose
      run: |
        docker-compose config

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run security scan on backend
      run: |
        cd backend
        pip install safety
        safety check -r requirements.txt || echo "Security check completed"
